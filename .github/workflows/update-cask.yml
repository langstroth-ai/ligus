# Manual fallback to bump the Homebrew cask on the tap repo
# (langstroth-ai/homebrew-ligus) to a given tag's version + DMG sha256.
#
# The automatic bump on every release lives in release.yml's `cask` job (it runs
# in the tag's context after the `publish` job has published the release). A `release: published` trigger
# does NOT work here: releases created by tauri-action use GITHUB_TOKEN, and
# GitHub does not fire the `release` event for GITHUB_TOKEN-created releases. So
# this workflow is dispatch-only — use it to re-bump a past release by hand.
# It refuses a tag whose release is still a draft: the tap must only ever
# point at a published release (a draft's download URL 404s for users).
#
# Needs HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents:write on
# langstroth-ai/homebrew-ligus (the default GITHUB_TOKEN can't push cross-repo).
name: Update Homebrew cask (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.2)"
        required: true

# The job only reads a public release asset and pushes with TAP_TOKEN.
permissions:
  contents: read

jobs:
  bump:
    runs-on: macos-latest
    steps:
      # Only for scripts/tap-push.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: The release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::malformed tag '$TAG'"; exit 1; }
          # The tags endpoint never returns drafts: a 404 here means there is
          # no published release for the tag (none, or still a draft).
          if ! state=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.draft)"'); then
            echo "::error::$TAG has no published release (missing, or still a draft); publish it first"
            exit 1
          fi
          [ "$state" = false ] || { echo "::error::$TAG is still a draft"; exit 1; }

      - name: Bump the cask on the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          DMG="Ligus_${VERSION}_aarch64.dmg"
          echo "Fetching $DMG to hash it…"
          curl -fsSL --retry 5 --retry-delay 10 -o ligus.dmg \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG}"
          SHA=$(shasum -a 256 ligus.dmg | awk '{print $1}')
          echo "sha256=$SHA"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/langstroth-ai/homebrew-ligus.git" tap
          # The desktop cask is ligus-app. Never recreate the old Casks/hive.rb:
          # the tap keeps it, disabled, pointing hive users at Ligus.
          # tap-push.sh reruns this after rebasing onto a concurrent tap push.
          bump_cask() {
            test -f Casks/ligus-app.rb || { echo "::error::Casks/ligus-app.rb missing on the tap"; return 1; }
            sed -i '' -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/ligus-app.rb
            sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"${SHA}\"/" Casks/ligus-app.rb
            # The app updates itself, so brew upgrade leaves it alone unless
            # --greedy. Added once, before depends_on (Homebrew's stanza order).
            if ! grep -qx '  auto_updates true' Casks/ligus-app.rb; then
              awk '!done && /^  depends_on / { print "  auto_updates true"; print ""; done = 1 } { print }' Casks/ligus-app.rb > Casks/ligus-app.rb.new
              mv Casks/ligus-app.rb.new Casks/ligus-app.rb
            fi
            grep -qx '  auto_updates true' Casks/ligus-app.rb || { echo "::error::no depends_on line in Casks/ligus-app.rb to put auto_updates before"; return 1; }
          }
          export -f bump_cask
          export VERSION SHA
          scripts/tap-push.sh tap "ligus-app ${VERSION}" bump_cask
