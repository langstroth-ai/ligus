name: Docs

# Builds the documentation site (docs-site, https://docs.langstroth.ai/) and
# checks that every old docs URL is redirected. Netlify publishes the site
# (see docs-site/README.md); this workflow only checks it.

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The redirect check reads the pre-2.0 sites from git history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install mkdocs
        # Same pinned versions Netlify installs (mkdocs-material 9.x).
        run: pip install -r docs-site/requirements.txt
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict -f docs-site/mkdocs.yml
      - name: Check every old docs URL is redirected
        run: python3 docs-site/tools/redirects.py check --refs --built
