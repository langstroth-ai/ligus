name: kind-e2e

# Builds the CLI container image and runs the Kubernetes Phase 1 acceptance
# checks on kind (docs/design/kubernetes.md, section 14): the relay chart
# (from the relay repository) with Postgres, one serve StatefulSet on a
# throwaway workspace, sync between two client identities through the relay,
# no plaintext in the relay database, restart on the same identity, Pod
# Security "restricted" and NetworkPolicy isolation.
# The chart sets LIGUS_* variables and the test pod runs `ligus`, so this
# needs a tree at 0.1 or later (the Ligus rename; 0.1 ignores HIVE_*).
# Runs on release branches and tags, on PRs that touch the chart, the
# container image or this workflow, and on manual dispatch. It takes ~15-25
# min (two image builds plus a kind cluster), so ordinary crate changes no
# longer trigger it; the release branch and the tag catch them before a
# release ships.
on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/kind-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Repository and commit holding the langstroth-relay chart and image: pinned to
  # a tested commit (relay v0.3.0), never a moving branch. Bump it together
  # with the ligus chart's langstroth-relay dependency.
  RELAY_REPO: langstroth-ai/langstroth-relay
  RELAY_REF: c20bba675733b590f387d8ec69046e0b619f4954

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.RELAY_REPO }}
          ref: ${{ env.RELAY_REF }}
          path: _relay
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build CLI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/container/Dockerfile
          tags: ligus:dev
          load: true
          cache-from: type=gha,scope=ligus-cli
          cache-to: type=gha,scope=ligus-cli,mode=max
      - name: image checks
        run: |
          docker run --rm ligus:dev --version
          test "$(docker inspect -f '{{.Config.User}}' ligus:dev)" = "65532:65532"
      - name: build relay image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: _relay
          file: _relay/deploy/container/Dockerfile
          tags: langstroth-relay:dev
          load: true
          cache-from: type=gha,scope=langstroth-relay
          cache-to: type=gha,scope=langstroth-relay,mode=max
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: lint and render
        run: |
          set -e
          mkdir -p deploy/helm/ligus/charts
          helm package -d deploy/helm/ligus/charts _relay/deploy/helm/langstroth-relay
          helm lint --strict deploy/helm/ligus -f deploy/helm/ligus/ci/kind-values.yaml
          helm lint --strict deploy/helm/ligus -f deploy/helm/ligus/ci/kind-values.yaml \
            --set serve.enabled=false --set worker.enabled=true --set workspace.existingSecret=ws-worker
          helm template t deploy/helm/ligus --set workspace.existingSecret=ws --set relay.enabled=true \
            --set relay.postgres.enabled=true --set relay.postgres.existingSecret=pg --set relay.tunnel.mode=open \
            --set remote.enabled=true --set remote.insecureRelay=true \
            --set worker.enabled=true --set 'worker.instances[0].name=a' --set 'worker.instances[1].name=b' >/dev/null
          # Must refuse: the removed executor template, and no workspace.
          # (`if`, not a bare `!`: bash's errexit ignores a negated command,
          # so `! cmd` mid-script never failed the step.)
          if helm template t deploy/helm/ligus --set relayUrl=x --set workspace.existingSecret=ws \
              --set networkPolicy.relayNamespace=r --set sandbox.enabled=true >/dev/null 2>&1; then
            echo "::error::chart rendered the removed sandbox.* values"; exit 1
          fi
          if helm template t deploy/helm/ligus --set relayUrl=x >/dev/null 2>&1; then
            echo "::error::chart rendered without a workspace"; exit 1
          fi
          python3 deploy/helm/ligus/ci/security_test.py
      - name: agent deploy tooling (shellcheck, exit codes, --json schema)
        run: bash deploy/tests/agent-deploy-test.sh
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: ligus-e2e
      - name: load images
        run: kind load docker-image ligus:dev langstroth-relay:dev --name ligus-e2e
      - name: install relay
        run: |
          kubectl create namespace langstroth-relay
          kubectl label namespace langstroth-relay pod-security.kubernetes.io/enforce=restricted
          # The relay chart's tunnel is off by default since relay 0.2.0. Open
          # is fine for this throwaway in-cluster relay; never without a token
          # gate on a reachable one.
          # The dev Postgres reads its password and DSN from a Secret the
          # operator creates: relay charts after v0.3.0 generate none and
          # refuse postgres.enabled without it (v0.3.0 ignores both).
          PW=$(openssl rand -hex 24)
          kubectl -n langstroth-relay create secret generic relay-dev-postgres \
            --from-literal=password="$PW" \
            --from-literal=DATABASE_URL="postgres://relay:$PW@langstroth-relay-postgres:5432/relay?sslmode=disable"
          helm install langstroth-relay _relay/deploy/helm/langstroth-relay -n langstroth-relay \
            --set image.repository=langstroth-relay --set image.tag=dev \
            --set postgres.enabled=true --set postgres.existingSecret=relay-dev-postgres \
            --set postgres.persistence.size=256Mi \
            --set tunnel.mode=open --wait --timeout 5m
          helm test langstroth-relay -n langstroth-relay --logs
      - name: runner kernel has Landlock
        run: |
          # serve and the worker refuse agent turns without confinement
          # (agentSandbox.require), and under Pod Security "restricted" the
          # only tier is Landlock, which the kind node shares with this runner's
          # kernel. This job runs the confined path only: if the runner has no
          # Landlock, fail here, saying so, rather than at a helm timeout. It
          # never falls back to an unconfined install.
          uname -r
          lsm=$(cat /sys/kernel/security/lsm 2>/dev/null || true)
          echo "LSMs: ${lsm:-unreadable}"
          case ",$lsm," in
            *,landlock,*) echo "Landlock is enabled on the runner kernel" ;;
            *) echo "::error::this runner's kernel has no Landlock in its LSM list, so the confined path (agentSandbox tier landlock) cannot run here; use a runner with Landlock (Linux 6.7+, landlock in lsm=)"; exit 1 ;;
          esac
      - name: install workspace (throwaway)
        run: |
          kubectl create namespace ligus-ws-smoke
          kubectl label namespace ligus-ws-smoke pod-security.kubernetes.io/enforce=restricted
          # A throwaway workspace: nobody outside the cluster holds this key.
          kubectl -n ligus-ws-smoke create secret generic ws-smoke \
            --from-literal=room="k8s-test-$(cat /proc/sys/kernel/random/uuid)" \
            --from-literal=key="$(openssl rand -base64 36)"
          # serve alone (kind-values has the worker off), so serve founds this
          # workspace as its Owner; the worker gets its own workspace below.
          helm install smoke deploy/helm/ligus -n ligus-ws-smoke \
            -f deploy/helm/ligus/ci/kind-values.yaml --wait --timeout 5m
      - name: install worker (own throwaway workspace)
        run: |
          # 0.1 admits a box to a workspace only through an Admin's invite, and
          # nothing here can issue one headlessly yet, so the worker cannot
          # join serve's workspace (it would found a competing one or be
          # refused). It runs the same chart, sandbox preflight and Pod
          # Security as serve, as the sole member of a workspace of its own.
          kubectl create namespace ligus-ws-worker
          kubectl label namespace ligus-ws-worker pod-security.kubernetes.io/enforce=restricted
          kubectl -n ligus-ws-worker create secret generic ws-worker \
            --from-literal=room="k8s-test-$(cat /proc/sys/kernel/random/uuid)" \
            --from-literal=key="$(openssl rand -base64 36)"
          helm install wk deploy/helm/ligus -n ligus-ws-worker \
            -f deploy/helm/ligus/ci/kind-values.yaml \
            --set serve.enabled=false --set worker.enabled=true --set workspace.existingSecret=ws-worker \
            --wait --timeout 5m
      - name: sync and a sandboxed agent turn (helm test)
        run: helm test smoke -n ligus-ws-smoke --logs | tee /tmp/test.log
      - name: agent turn inside the serve container is confined by Landlock
        run: |
          set -euo pipefail
          # One real headless turn (stub model, run_command) in the serve
          # container itself: the tier must be landlock, the command must run,
          # and it must not read PID 1's environ (the pod's env), serve's own
          # environ, the data dir or the mounted secret files.
          kubectl -n ligus-ws-smoke exec smoke-ligus-serve-0 -c serve -- \
            ligus doctor --require-confined --expect-tier landlock --turn-test | tee /tmp/turn.log
          grep -q 'turn test: agent sandbox: landlock' /tmp/turn.log
          grep -q 'turn test: run_command ran: yes' /tmp/turn.log
          grep -q 'turn test: DENIED_ENVIRON_1$' /tmp/turn.log
          grep -q 'turn test: passed (tier landlock)' /tmp/turn.log
          if grep -q LIGUS_PROBE_LEAK /tmp/turn.log; then echo "::error::the turn read something it must not"; exit 1; fi
          # serve itself is not dumpable: its /proc entries belong to root.
          kubectl -n ligus-ws-smoke exec smoke-ligus-serve-0 -c serve -- bash -c '
            for p in /proc/[0-9]*; do
              case "$(tr "\0" " " <"$p/cmdline" 2>/dev/null)" in
                "/usr/local/bin/ligus serve"*)
                  owner=$(stat -c %u "$p/environ"); echo "serve pid ${p#/proc/} environ owner uid $owner"; test "$owner" = 0; exit $? ;;
              esac
            done; echo "serve process not found"; exit 1'
          # The preflight ran before serve started.
          kubectl -n ligus-ws-smoke logs smoke-ligus-serve-0 -c sandbox-preflight | grep -q 'turn test: passed'
      - name: worker probes
        run: |
          kubectl -n ligus-ws-worker wait --for=condition=Ready pod -l app.kubernetes.io/component=worker --timeout=180s
          kubectl -n ligus-ws-worker get pods -l app.kubernetes.io/component=worker
          kubectl -n ligus-ws-worker logs wk-ligus-worker-w1-0 -c sandbox-preflight | grep -q 'turn test: passed (tier landlock)'
      - name: tunnel host connected
        run: |
          for _ in $(seq 30); do
            kubectl -n ligus-ws-smoke logs smoke-ligus-serve-0 | grep -q 'remote: connected to .*status active' && exit 0
            sleep 2
          done
          exit 1
      - name: no plaintext in the relay database
        run: |
          marker=$(grep -o 'k8s-smoke-[0-9]*-[0-9]*' /tmp/test.log | tail -1)
          test -n "$marker"
          if kubectl -n langstroth-relay exec langstroth-relay-postgres-0 -- pg_dump -U relay -d relay --data-only | grep -q "$marker"; then
            echo "::error::plaintext marker found in the relay database"; exit 1
          fi
      - name: restart keeps the identity
        run: |
          before=$(kubectl -n ligus-ws-smoke logs smoke-ligus-serve-0 | grep -o 'host [0-9a-f-]\{36\}' | head -1)
          kubectl -n ligus-ws-smoke delete pod smoke-ligus-serve-0 --wait=true
          kubectl -n ligus-ws-smoke wait --for=condition=Ready pod/smoke-ligus-serve-0 --timeout=180s
          after=$(kubectl -n ligus-ws-smoke logs smoke-ligus-serve-0 | grep -o 'host [0-9a-f-]\{36\}' | head -1)
          echo "$before / $after"; test -n "$before" && test "$before" = "$after"
      - name: Pod Security and NetworkPolicy
        run: |
          if kubectl -n ligus-ws-smoke run psa --image=busybox:1.37 --restart=Never --dry-run=server \
              --overrides='{"spec":{"containers":[{"name":"p","image":"busybox:1.37","securityContext":{"privileged":true}}]}}'; then
            echo "::error::Pod Security admitted a privileged pod"; exit 1
          fi
          kubectl create namespace np-probe
          kubectl -n np-probe run probe --image=curlimages/curl:8.17.0 --restart=Never --command -- sleep 300
          kubectl -n np-probe wait --for=condition=Ready pod/probe --timeout=120s
          sleep 5
          code=$(kubectl -n np-probe exec probe -- curl -s -m 5 -o /dev/null -w '%{http_code}' \
            http://smoke-ligus-serve.ligus-ws-smoke.svc.cluster.local:8787/v1/health || true)
          echo "serve from another namespace: $code"; test "$code" != 200
      - name: diagnostics
        if: failure()
        run: |
          # Pods, events and logs from both namespaces. Never prints Secret
          # values: describe shows only key names, and nothing reads a Secret.
          # Pods carry only the selector labels, so walk them by name.
          kubectl get pods,pvc,svc,networkpolicy -A -o wide || true
          kubectl get storageclass || true
          for ns in langstroth-relay ligus-ws-smoke ligus-ws-worker; do
            echo "::group::$ns events"
            kubectl -n "$ns" get events --sort-by=.lastTimestamp || true
            echo "::endgroup::"
            echo "::group::$ns describe pods"
            kubectl -n "$ns" describe pods || true
            echo "::endgroup::"
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              for c in $(kubectl -n "$ns" get "$pod" -o jsonpath='{.spec.initContainers[*].name} {.spec.containers[*].name}'); do
                echo "::group::$ns $pod container $c"
                kubectl -n "$ns" logs "$pod" -c "$c" --tail=300 || true
                echo "--- previous instance ---"
                kubectl -n "$ns" logs "$pod" -c "$c" --previous --tail=300 2>/dev/null || echo "(none)"
                echo "::endgroup::"
              done
            done
          done
