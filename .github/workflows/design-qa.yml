name: Design QA

# Renders the desktop app in mock mode (web: bun run dev:mock) in headless
# Chrome across themes and views, and checks each capture for text contrast,
# text below 11px, more than one banner, badge count and accent-filled regions
# (web/tools/scan.mjs). What already breaks a rule is recorded in
# web/tools/design-qa-baseline.json and tolerated; anything new fails. The
# colour tokens' own contrast and colour-vision checks run in ci.yml.
#
# Not part of the required ci-ok check: a failure here asks for a look at the
# screenshots (uploaded as an artifact), not a blocked merge queue.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/branding/**"
      - ".github/workflows/design-qa.yml"
  pull_request:
    paths:
      - "web/**"
      - "assets/branding/**"
      - ".github/workflows/design-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    # ubuntu-24.04 ships Google Chrome at /usr/bin/google-chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install web deps
        run: bun install --frozen-lockfile
      - name: Start the mock app
        run: |
          nohup bun run dev:mock > /tmp/mock.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5199/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/mock.log
          exit 1
      - name: Scan captures
        run: node tools/scan.mjs --out /tmp/design-qa
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-qa
          path: /tmp/design-qa
          retention-days: 7
