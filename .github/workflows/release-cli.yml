# Builds the `ligus` CLI/daemon binary for macOS + Linux and attaches it to the
# GitHub Release for the tag as `ligus-<target>` (what install.sh and the tap
# fetch) and, through v2.1, the same bytes as `hive-<target>` for anything that
# still downloads the former name. The desktop app is built separately by
# release.yml.
name: release-cli

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS runners (macos-13) are being retired and can queue for
          # hours; cross-compile the x86_64 slice on the Apple-Silicon runner,
          # whose Xcode clang targets x86_64 out of the box.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - name: Install musl toolchain (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build ligus CLI
        run: cargo build --release --locked -p hive-cli --target ${{ matrix.target }}

      - name: Stage asset
        run: |
          install -m 0755 "target/${{ matrix.target }}/release/ligus" "ligus-${{ matrix.target }}"
          # Former asset name, same bytes (removed in v2.2). Run as `hive`, the
          # binary prints a one-line reminder on stderr.
          cp "ligus-${{ matrix.target }}" "hive-${{ matrix.target }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ligus-${{ matrix.target }}
            hive-${{ matrix.target }}
          fail_on_unmatched_files: true

  # Publish/update the Homebrew CLI formula on the tap once the per-arch binaries
  # are uploaded, so `brew install ligus-ai/ligus/ligus` tracks releases. The
  # formula is `ligus` (the desktop cask is `ligus-app`, so the names don't
  # collide) and also links the former command name `hive`. Never write the old
  # Formula/hive-cli.rb: the tap's formula_renames.json maps it to ligus. Needs
  # HOMEBREW_TAP_TOKEN (fine-grained PAT, Contents:write on
  # ligus-ai/homebrew-ligus); skips cleanly when absent.
  formula:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the tap formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping formula update."
            exit 0
          fi
          VERSION="${TAG#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          declare -A sha
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            for i in 1 2 3 4 5; do
              if gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "ligus-${t}" --output "ligus-${t}" --clobber; then break; fi
              echo "ligus-${t} not ready (attempt ${i}) - retrying"; sleep 15
            done
            sha[$t]=$(sha256sum "ligus-${t}" | awk '{print $1}')
          done
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ligus-ai/homebrew-ligus.git" tap
          mkdir -p tap/Formula
          cat > tap/Formula/ligus.rb <<RUBY
          class Ligus < Formula
            desc "Headless Ligus client + agent daemon (formerly hive-cli)"
            homepage "https://github.com/ligus-ai/ligus"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/ligus-aarch64-apple-darwin"
                sha256 "${sha[aarch64-apple-darwin]}"
              end
              on_intel do
                url "${base}/ligus-x86_64-apple-darwin"
                sha256 "${sha[x86_64-apple-darwin]}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/ligus-aarch64-unknown-linux-musl"
                sha256 "${sha[aarch64-unknown-linux-musl]}"
              end
              on_intel do
                url "${base}/ligus-x86_64-unknown-linux-musl"
                sha256 "${sha[x86_64-unknown-linux-musl]}"
              end
            end

            def install
              bin.install Dir["ligus-*"].first => "ligus"
              # Former command name, kept through v2.1; it prints a one-line reminder on stderr.
              bin.install_symlink "ligus" => "hive"
            end

            test do
              assert_path_exists bin/"ligus"
              assert_path_exists bin/"hive"
            end
          end
          RUBY
          cd tap
          git config user.name "ligus-release-bot"
          git config user.email "release@ligus.ai"
          if git add Formula/ligus.rb && git commit -m "ligus ${VERSION}"; then
            git push origin HEAD
            echo "Formula ligus bumped to ${VERSION}."
          else
            echo "Formula already at ${VERSION} — nothing to do."
          fi
