# Builds the `ligus` CLI/daemon binary for macOS + Linux and attaches it to the
# tag's DRAFT GitHub Release as `ligus-<target>` (what install.sh and the tap
# fetch), with a `.sha256` next to each.
#
# Not triggered on its own: release.yml calls it (job `cli`) after its
# `release` job has created the draft, and publishes the release only when
# these builds, the desktop builds and the updater check have all succeeded.
# One workflow run therefore gates the whole release; see release.yml's header.
#
# The toolchain setup and build command live in .github/actions/build-cli,
# which ci.yml also uses to build every target below on each PR, so a target
# that doesn't build fails the merge queue instead of the release.
name: release-cli

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        type: string
      release-id:
        description: "Id of the draft release the caller's release job created"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Every target here must also be in ci.yml's cli-targets matrix
      # (scripts/test-release-workflow.rb checks it).
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          # Intel macOS runners (macos-13) are being retired and can queue for
          # hours; cross-compile the x86_64 slice on the Apple-Silicon runner,
          # whose Xcode clang targets x86_64 out of the box.
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Always the tag, also on a manual dispatch of release.yml (which
        # would otherwise check out the dispatching branch).
        with:
          ref: refs/tags/${{ inputs.tag }}

      # A tag that is not v<the version of every ligus crate> must not
      # build or upload a binary.
      - name: Check the tag against the versions
        env:
          TAG: ${{ inputs.tag }}
        run: scripts/check-release-config.sh "$TAG"

      - name: Build ligus CLI
        id: build
        uses: ./.github/actions/build-cli
        env:
          # Public device-flow client ids baked in by ligus-forge (see release.yml).
          LIGUS_GITHUB_APP_CLIENT_ID: ${{ vars.LIGUS_GITHUB_APP_CLIENT_ID }}
          LIGUS_GITLAB_CLIENT_ID: ${{ vars.LIGUS_GITLAB_CLIENT_ID }}
        with:
          target: ${{ matrix.target }}
          profile: release

      - name: Stage asset
        # install.sh refuses a binary that does not match its .sha256 file.
        env:
          BIN: ${{ steps.build.outputs.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          install -m 0755 "$BIN" "ligus-$TARGET"
          if command -v sha256sum >/dev/null; then
            sha256sum "ligus-$TARGET" > "ligus-$TARGET.sha256"
          else
            shasum -a 256 "ligus-$TARGET" > "ligus-$TARGET.sha256"
          fi
          cat "ligus-$TARGET.sha256"

      # Upload to the draft by tag (gh finds drafts by tag through GraphQL's
      # release(tagName:); the REST tags endpoint does not), after checking
      # that the release gh resolves is the very draft the release job made:
      # never a published release, never a stray second draft. --clobber
      # makes a rerun replace this target's files. Never publishes: the
      # publish job in release.yml does that once everything has succeeded.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ inputs.release-id }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          got=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft --jq '"\(.databaseId) \(.isDraft)"')
          if [ "$got" != "$RELEASE_ID true" ]; then
            echo "::error::gh resolves $TAG to release '$got' (id, draft), not the draft $RELEASE_ID"
            exit 1
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "ligus-$TARGET" "ligus-$TARGET.sha256"
