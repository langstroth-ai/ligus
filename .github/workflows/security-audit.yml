name: security-audit

# Dependency-security gate: RUSTSEC advisories + license/ban policy (cargo-deny)
# and a frontend dependency audit. Runs on dependency changes, on PRs, and weekly
# (so a newly-disclosed advisory against an unchanged tree is still caught).
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  web-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Frontend dependency audit
        working-directory: web
        # `bun audit` reports known vulns in the resolved tree. The tree is clean
        # as of the 0.1 dependency upgrade, so a new advisory now fails the job.
        # One owner-approved exception: GHSA-fc5q-39xc-vjpf (picomatch ReDoS) has
        # no patched release yet and reaches us only through vite/vitest matching
        # our own config globs, not the shipped bundle. The next step fails as soon
        # as a picomatch newer than 4.0.7 is published, so the ignore can't outlive
        # the fix.
        run: bun audit --ignore=GHSA-fc5q-39xc-vjpf
      - name: picomatch fix released (drop the audit ignore)
        run: |
          latest=$(npm view picomatch version)
          echo "latest picomatch: $latest"
          if [ "$latest" != "4.0.7" ]; then
            echo "::error::picomatch $latest is out: upgrade it and remove --ignore=GHSA-fc5q-39xc-vjpf"
            exit 1
          fi
