name: security-audit

# Dependency-security gate: RUSTSEC advisories + license/ban policy (cargo-deny)
# and a frontend dependency audit. Runs on dependency changes, on PRs, and weekly
# (so a newly-disclosed advisory against an unchanged tree is still caught).
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories licenses bans sources

  web-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Frontend dependency audit
        working-directory: web
        # `bun audit` reports known vulns in the resolved tree; any advisory
        # fails the job. (The picomatch exception, GHSA-fc5q-39xc-vjpf, is gone:
        # the advisory was withdrawn on 2026-11-18.)
        run: bun audit
