name: ci

# Per-push / per-PR gate for the Rust workspace (crates/, app/) and the web
# frontend (web/). Docs-only changes (docs/, docs-site/, root *.md)
# match none of the paths below and skip this workflow entirely.
#
#   web      one Linux job: bun install, vitest, typecheck + vite build (was
#            repeated on all three OSes).
#   rust     Linux + macOS: ts-rs bindings check (Linux), nextest over the
#            whole workspace, doctests, a debug build of every binary.
#   windows  on PRs: build + every test except the pure-logic property suites
#            (`*_props` binaries, covered on Linux/macOS), with in-module
#            property tests at 16 cases. On pushes to main/release branches
#            and manual runs: the full suite. ci-nightly.yml also runs it.
#   cli-targets
#            a debug build of the `ligus` CLI for EVERY target release-cli.yml
#            ships (two macOS slices, x86_64 and aarch64 Linux musl), with the
#            same composite action (.github/actions/build-cli) the release
#            uses, so a target-specific break (a libc constant musl lacks on
#            one arch, a cross-compile link error) fails the merge queue, not
#            the tag. Debug, because those breaks are compile and link errors
#            the release profile adds nothing to; ci-nightly.yml builds the
#            release profile natively. Runs when crates/, Cargo.toml,
#            Cargo.lock or the action change.
#            The desktop app's release targets need no extra job: release.yml
#            builds them natively on macOS (aarch64), Windows (x64) and Linux
#            (x64), the triples `rust` and `windows` already build here.
#   ci-ok    the one required check for the merge queue. PRs and merge-queue
#            runs always start; `changes` skips the jobs above when nothing
#            under the paths below changed, and ci-ok passes on skipped jobs.
#
# Release-profile (thin LTO, codegen-units=1) builds moved to ci-nightly.yml:
# they took 3-5 min per OS here and test nothing a debug build doesn't except
# the optimiser and linker. release.yml / release-cli.yml still build them.
#
# Third-party actions are pinned by commit SHA (the comment is the tag).
on:
  push:
    branches: [main, "release/**"]
    paths:
      - "crates/**"
      - "app/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".config/nextest.toml"
      - ".github/actions/build-cli/**"
      - ".github/workflows/ci.yml"
  # No paths filter: the required ci-ok check must report on every PR and
  # merge-queue run. The changes job applies the same paths instead.
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; main/release runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  NEXTEST_VERSION: "0.9.151"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      cli: ${{ steps.diff.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Pushes are already filtered by paths; manual runs test everything.
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            { echo code=true; echo cli=true; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^(crates/|app/|web/|Cargo\.toml$|Cargo\.lock$|\.config/nextest\.toml$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi
          # The CLI's release targets: its sources and the shared build action.
          if grep -qE '^(crates/|Cargo\.toml$|Cargo\.lock$|\.github/actions/build-cli/|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo cli=true >> "$GITHUB_OUTPUT"
          else
            echo cli=false >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # Vitest 5, jsdom 31 and jest-dom 7 need Node 22+ (jsdom: 22.22.2+, 24.15+
      # or 26+); pin it rather than inherit whatever the runner image ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install web deps
        run: bun install --frozen-lockfile
      - name: Web tests (vitest)
        run: bun run test
      - name: Web typecheck + build
        run: bun run build
      # Monaco vendors DOMPurify; vite.config.ts swaps it for the overridden
      # npm package. Fail if any other DOMPurify version reached the bundle
      # (DOMPurify's minified init sets .version then .removed=[]).
      - name: Bundled DOMPurify is the pinned one
        run: |
          want=$(node -p 'require("./package.json").overrides.dompurify')
          found=$(grep -ohE '\.version=.[0-9]+\.[0-9]+\.[0-9]+.,[A-Za-z_$]+\.removed=' dist/assets/*.js | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -u)
          echo "pinned=$want bundled=$found"
          test -n "$found" && test "$found" = "$want"

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: -latest moves to 26.04 this month,
        # which ships an AppArmor profile for bwrap and would silently change
        # the sandbox tier under test.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # The ubuntu-24.04 image (20261101: kernel 7.0.0-azure, Landlock in the
      # LSM list, AppArmor userns restriction on, /usr/bin/bwrap present but
      # with no AppArmor profile, so it can't create namespaces) gets the
      # landlock tier; macOS has sandbox-exec. Either way the sandbox tests
      # must run, not print SKIPPED. Windows has no agent sandbox.
      LIGUS_REQUIRE_SANDBOX: "1"
      # Proptest's default, stated: ci-nightly.yml runs 4096.
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux Tauri system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - name: Sandbox facts
        if: runner.os == 'Linux'
        run: |
          uname -r
          cat /sys/kernel/security/lsm || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          command -v bwrap || echo "no bwrap"; echo "expecting the landlock tier"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
          # Only main/release save (PR caches are invisible to other PRs and
          # just evict the shared ones); PRs restore the main cache.
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # The test-only passkey shortcut (ligus-runtime `test-presence`) must
      # never be in a shipped binary's build graph.
      - name: No test-presence in shipped builds
        shell: bash
        run: scripts/check-no-test-presence.sh

      - name: Check ts-rs bindings are in sync
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p ligus-proto export_bindings
          if ! git diff --quiet -- web/src/bindings; then
            echo "::error::ts-rs bindings are stale — run 'cargo test -p ligus-proto export_bindings' and commit web/src/bindings/"
            git diff -- web/src/bindings
            exit 1
          fi

      - name: Tests (nextest)
        run: cargo nextest run --locked --workspace --profile ci

      # nextest doesn't run doctests.
      - name: Doctests
        run: cargo test --locked --workspace --doc

      # Debug build of the desktop shell and the CLI. Reuses the test build's
      # dependency artifacts, so it costs a link, not a rebuild.
      - name: Build binaries
        run: cargo build --locked --workspace --bins

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}

      # prop_ledger_replay_converges spawns thousands of git processes, which
      # takes over ten minutes on Windows at 256 cases. Its logic isn't
      # platform-specific, and Linux and macOS run it in full.
      - name: Tests (nextest, full)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          PROPTEST_CASES: "256"
        run: cargo nextest run --locked --workspace --profile ci -E "not test(=repos::tests::prop_ledger_replay_converges)"

      # PRs and merge-queue runs; the push after the merge runs the full suite.
      - name: Tests (nextest, PR subset)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          PROPTEST_CASES: "16"
        run: cargo nextest run --locked --workspace --profile ci -E "not binary(/_props$/)"

      - name: Doctests
        run: cargo test --locked --workspace --doc

      - name: Build binaries
        run: cargo build --locked --workspace --bins

  # Every target release-cli.yml ships (scripts/test-release-workflow.rb
  # checks the two matrices match), built the way the release builds it.
  cli-targets:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ligus CLI
        uses: ./.github/actions/build-cli
        with:
          target: ${{ matrix.target }}
          profile: debug
          save-cache: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}

  ci-ok:
    if: always()
    needs: [changes, web, rust, windows, cli-targets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
