name: Release (desktop app)

# Builds the Ligus desktop app for macOS, Linux, and Windows on GitHub runners
# and attaches the installers to a GitHub Release. Artifacts live as release
# assets — never committed to source control. The (private) hive-site Netlify
# build pulls the latest assets at deploy time (see that repo's
# scripts/fetch-downloads.sh).
#
# Trigger: push a plain tag like `v0.1.0` (it must match the app version), or run manually (workflow_dispatch).
#
# Release ownership: the `release` job (scripts/ensure-release.sh, shared with
# release-cli.yml) finds or creates the one release for the tag, and
# tauri-action only uploads to it by id. tauri-action v1 rewrites the name and
# body of an existing published release when given tagName, and with
# releaseDraft it refuses a published release, so it is never given either: a
# rerun cannot touch the notes, and the installers always land on the release
# release-cli also uses. A new release is created as a prerelease (not Latest);
# the owner promotes it with the notes:
#   gh release edit vX.Y.Z --title "Ligus vX.Y.Z" --notes-file notes.md \
#     --prerelease=false --latest
#
# Signing is wired but inert until the secrets exist (private beta ships
# unsigned — see task: "Auto-updater + code signing"):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_PATH  (notarization),
#            APPLE_TEAM_ID (the keychain unlock item's designated requirement)
#   updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   Windows: Azure Trusted Signing via a signCommand (added later)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
      platforms:
        description: "Which OSes to build (comma-sep: macos,windows,linux). macOS bills at 10x — skip it (build the .dmg locally) to save minutes."
        default: "macos,windows,linux"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Cheap Linux job that turns the `platforms` input into a build matrix, so a
  # dispatch can skip the 10x-billed macOS runner (or any OS) on demand. Tag
  # pushes still build all three.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'macos,windows,linux' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          req = {p.strip().lower() for p in os.environ["PLATFORMS"].split(",") if p.strip()}
          runner = {"macos": "macos-latest", "windows": "windows-latest", "linux": "ubuntu-22.04"}
          include = [{"platform": runner[k]} for k in ["macos", "windows", "linux"] if k in req]
          print("matrix=" + json.dumps({"include": include}))
          PY

  # Find or create the release for the tag (never edits an existing one).
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # Assign first: a failure inside $(...) as an echo argument would not
        # fail the step, and an empty releaseId makes tauri-action skip every
        # upload while still reporting success.
        run: |
          # Refuse a placeholder updater key, a foreign endpoint, or a tag that
          # isn't v<app version> (plain tags like v0.1.0).
          scripts/check-release-config.sh "$TAG"
          id=$(scripts/ensure-release.sh "$GITHUB_REPOSITORY" "$TAG")
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::no release id for $TAG"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [setup, release]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        # Canonical Tauri v2 deps. Use ayatana appindicator only — the older
        # libappindicator3-dev conflicts with it (held-broken-packages).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"
          # Fresh namespace (the first run's apt failure poisoned the old cache
          # → "can't find crate"), and never save a cache from a failed build.
          prefix-key: "rel-v2"
          cache-on-failure: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Build the web frontend deps
        run: bun install --frozen-lockfile
        working-directory: web

      # tauri-action would otherwise run "npm install -g @tauri-apps/cli@v2"
      # (whatever 2.x is newest) inside the step that holds the signing keys.
      # Install the exact version web/bun.lock pins, in a step with no secrets.
      - name: Install the Tauri CLI
        run: npm install -g --ignore-scripts @tauri-apps/cli@2.12.4

      # macOS signing + notarization — ONLY activates when the secrets exist
      # (otherwise the build stays unsigned; empty APPLE_* vars would make tauri
      # try and fail to codesign, so we export them only when present).
      - name: Configure macOS signing
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret — building unsigned."
            exit 0
          fi
          # The App Store Connect key must be a file for notarization.
          KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
            # Baked into the app: the keychain unlock item trusts only code
            # that satisfies Ligus's designated requirement for this team.
            if [ -n "$APPLE_TEAM_ID" ]; then echo "LIGUS_APPLE_TEAM_ID=$APPLE_TEAM_ID"; fi
          } >> "$GITHUB_ENV"
          echo "macOS signing + notarization configured."

      # The test-only passkey shortcut (hive-runtime `test-presence`) must
      # never be in a shipped binary's build graph.
      - name: No test-presence in shipped builds
        shell: bash
        run: scripts/check-no-test-presence.sh

      - name: Build + release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The GitHub OAuth App client id, baked in by build.rs so GitHub
          # sign-in (device flow) works in release builds. The id is public (not
          # a secret) but lives in a repo var/secret so it's not committed.
          # Without it, sign-in errors "needs a github oauth client id".
          LIGUS_GITHUB_CLIENT_ID: ${{ secrets.LIGUS_GITHUB_CLIENT_ID }}
          # Bake the release tag so the app can detect a newer published version
          # (the "update available" banner). Local/dev builds get "dev" and never
          # prompt. Bump docs-site/docs/version.json to this tag when publishing.
          LIGUS_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # APPLE_* (when present) come from the "Configure macOS signing" step
          # via $GITHUB_ENV. tauri-action signs + notarizes + staples on macOS.
          # Auto-updater signing: the Ligus updater key's private half (repo
          # secrets) must match the pubkey in app/tauri.conf.json, which the
          # release job checks is not the placeholder. tauri-action emits the
          # signed update artifacts + latest.json onto the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The CLI discovers app/tauri.conf.json from the repo root.
          tauriScript: tauri
          # Upload to the release the `release` job resolved. No tagName,
          # releaseName, releaseDraft or prerelease: with those, tauri-action
          # v1 looks the release up itself and rewrites a published release's
          # name and body on every run (see the header).
          releaseId: ${{ needs.release.outputs.id }}
          # Only used as the "notes" field of latest.json.
          releaseBody: "Installers attached below."

  # tauri-action merges latest.json per matrix job, so concurrent jobs can drop
  # each other's entry and a rerun changes asset ids. Fail loudly (rerun the
  # platform's job) rather than ship an updater feed that misses a platform.
  verify-updater:
    needs: [release, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check latest.json against the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'macos,windows,linux' }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
        run: python3 scripts/verify-latest-json.py --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" --tag "$TAG" --platforms "$PLATFORMS"

  # Auto-bump the Homebrew cask on the tap once the DMG is built + uploaded, so
  # `brew upgrade --cask ligus-app` tracks releases with no manual edits. Runs in the
  # tag's context (no cross-workflow tag ambiguity) after `build` uploads assets.
  # Needs HOMEBREW_TAP_TOKEN — a fine-grained PAT with Contents:write on
  # ligus-ai/homebrew-ligus (the default GITHUB_TOKEN can't push cross-repo).
  # Skips cleanly when the secret is absent. NOTE: kept here rather than in a
  # `release: published` workflow because releases created by GITHUB_TOKEN do not
  # fire the `release` event (GitHub's recursion guard), so that trigger never ran.
  cask:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: macos-latest
    steps:
      - name: Bump the tap cask
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping cask update."
            exit 0
          fi
          VERSION="${TAG#v}"
          DMG="Ligus_${VERSION}_aarch64.dmg"
          echo "Downloading ${DMG} from release ${TAG}"
          for i in 1 2 3 4 5; do
            if gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${DMG}" --output ligus.dmg --clobber; then
              break
            fi
            echo "asset not ready yet (attempt ${i}) - retrying"; sleep 15
          done
          SHA=$(shasum -a 256 ligus.dmg | awk '{print $1}')
          echo "sha256=$SHA"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ligus-ai/homebrew-ligus.git" tap
          cd tap
          # The desktop cask is ligus-app. Never recreate the old Casks/hive.rb:
          # the tap's cask_renames.json maps hive to ligus-app.
          test -f Casks/ligus-app.rb || { echo "::error::Casks/ligus-app.rb missing on the tap"; exit 1; }
          sed -i '' -E "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/ligus-app.rb
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"${SHA}\"/" Casks/ligus-app.rb
          git config user.name "ligus-release-bot"
          git config user.email "release@ligus.ai"
          if git commit -am "ligus-app ${VERSION}"; then
            git push origin HEAD
            echo "Cask bumped to ${VERSION}."
          else
            echo "Cask already at ${VERSION} — nothing to do."
          fi
