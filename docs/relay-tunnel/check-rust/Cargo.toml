[package]
name = "hive-tunnel-check"
version = "0.1.0"
edition = "2021"

# Standalone: not a member of the hive workspace.
[workspace]

[dependencies]
snow = "0.10"
serde_json = "1"
hex = "0.4"
base64 = "0.23"
sha2 = "0.11"
hkdf = "0.13"
ed25519-dalek = "3"
chacha20poly1305 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }
