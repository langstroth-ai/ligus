{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ligus.serviceAccountName" . }}
  labels:
    {{- include "ligus.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Phase 1 pods need no Kubernetes API access. The Phase 3 controller gets a
# namespaced Role for Jobs; nothing here is cluster-scoped.
automountServiceAccountToken: false
{{- end }}
