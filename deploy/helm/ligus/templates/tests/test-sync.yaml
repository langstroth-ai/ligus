{{- if and .Values.serve.enabled .Values.tests.sync.enabled }}
{{- $fullname := include "ligus.fullname" . -}}
# serve answers, and sync works end to end through the relay: two fresh
# client identities (each its own data dir, standing in for desktops) on a
# THROWAWAY workspace this pod makes up, so a chat created by one arrives at
# the other. The pod never holds the real workspace key (a failed test pod is
# kept for its logs). It needs a relay that admits a new room: with
# workspace-scoped relay tokens set tests.sync.enabled=false.
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-sync
  labels:
    {{- include "ligus.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
    ligus.ai/role: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  {{- include "ligus.podSpecCommon" . | nindent 2 }}
  containers:
    - name: client
      image: {{ default (include "ligus.image" .) .Values.tests.image }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          curl_health() { exec 3<>/dev/tcp/{{ $fullname }}-serve/{{ .Values.serve.service.port }}; printf 'GET /v1/health HTTP/1.0\r\nHost: x\r\n\r\n' >&3; head -1 <&3; }
          echo "serve health: $(curl_health)"
          curl_health | grep -q ' 200 '
          # A throwaway workspace: nobody else holds this key.
          export LIGUS_WORKSPACE="k8s-test-$(cat /proc/sys/kernel/random/uuid)"
          export LIGUS_WORKSPACE_KEY="$(head -c 36 /dev/urandom | base64)"
          marker="k8s-smoke-$(date +%s)-$RANDOM"
          mkdir -p /work/a /work/b
          export LIGUS_DATA_DIR=/work/a
          ligus sync
          ligus new "$marker" >/work/chat-id
          ligus sync
          export LIGUS_DATA_DIR=/work/b
          for i in 1 2 3 4 5; do ligus sync >/dev/null; ligus chats | grep -q "$marker" && break; sleep 2; done
          ligus chats | grep "$marker"
          echo "sync OK: chat created by client A arrived at client B through the relay"
      env:
        - name: HOME
          value: /work
        - name: LIGUS_RELAY_URL
          value: {{ include "ligus.relayUrl" . | quote }}
        {{- if .Values.workspace.relayAccessToken }}
        # Only the relay access token, from the same Secret; never the key.
        - name: LIGUS_SECRET_BACKEND
          value: k8s
        - name: LIGUS_SECRETS_DIR
          value: /etc/ligus/secrets/store
        {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { cpu: "1", memory: 512Mi }
      volumeMounts:
        - { name: work, mountPath: /work }
        - { name: tmp, mountPath: /tmp }
        {{- if .Values.workspace.relayAccessToken }}
        - { name: relay-token, mountPath: /etc/ligus/secrets/store, readOnly: true }
        {{- end }}
  volumes:
    - name: work
      emptyDir: {}
    - name: tmp
      emptyDir: {}
    {{- if .Values.workspace.relayAccessToken }}
    - name: relay-token
      secret:
        secretName: {{ include "ligus.workspaceSecretName" . }}
        defaultMode: 0400
        items:
          - { key: {{ .Values.workspace.secretKeys.relayAccessToken }}, path: cli.token }
    {{- end }}
{{- end }}
