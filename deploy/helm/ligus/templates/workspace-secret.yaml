{{- include "ligus.validate" . -}}
{{- if and .Values.workspace.generate (not .Values.workspace.existingSecret) }}
{{- $name := include "ligus.workspaceSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $room := "" -}}
{{- $key := "" -}}
{{- if and $existing $existing.data -}}
{{- $room = index $existing.data .Values.workspace.secretKeys.room | b64dec -}}
{{- $key = index $existing.data .Values.workspace.secretKeys.key | b64dec -}}
{{- else -}}
{{- $room = printf "k8s-test-%s" (uuidv4) -}}
{{- $key = randAlphaNum 48 -}}
{{- end }}
# TEST ONLY: a throwaway workspace. The key exists only in this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" . | nindent 4 }}
    ligus.ai/test-workspace: "true"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.workspace.secretKeys.room }}: {{ $room | b64enc | quote }}
  {{ .Values.workspace.secretKeys.key }}: {{ $key | b64enc | quote }}
{{- end }}
