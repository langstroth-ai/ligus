{{- range $i, $s := .Values.mcp.servers }}
{{- if $i }}
---
{{- end }}
{{- $name := printf "mcp-%s" $s.name | trunc 63 | trimSuffix "-" }}
{{- if $s.secretEnv }}
{{- fail (printf "mcp.servers[%s].secretEnv (envFrom of a whole Secret) was removed: list each variable the server needs in env with valueFrom.secretKeyRef" $s.name) }}
{{- end }}
{{- if and (not (contains "@sha256:" (required "mcp.servers[].image is required" $s.image))) (not $s.allowUnpinned) }}
{{- fail (printf "mcp.servers[%s].image must be pinned by digest (image@sha256:...): MCP servers are third-party code that holds their secrets. Set allowUnpinned=true to accept a tag." $s.name) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp
    ligus.ai/mcp: {{ $s.name | quote }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ default 8080 $s.port }}
      targetPort: http
  selector:
    {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 4 }}
    ligus.ai/mcp: {{ $s.name | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp
    ligus.ai/mcp: {{ $s.name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 6 }}
      ligus.ai/mcp: {{ $s.name | quote }}
  template:
    metadata:
      labels:
        {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 8 }}
        ligus.ai/mcp: {{ $s.name | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml (default $.Values.podSecurityContext $s.podSecurityContext) | nindent 8 }}
      containers:
        - name: mcp
          image: {{ required "mcp.servers[].image is required" $s.image }}
          {{- with $s.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml (default $.Values.securityContext $s.securityContext) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ default 8080 $s.port }}
          {{- with $s.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "500m" "memory" "256Mi")) $s.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# Only this workspace's serve and worker pods may call this MCP server; it
# may reach DNS and, unless internetHttps is false, HTTPS outside cloud
# metadata and private ranges, plus its own egress rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 6 }}
      ligus.ai/mcp: {{ $s.name | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              ligus.ai/role: controller
      ports:
        - port: http
  egress:
    {{- include "ligus.dnsEgress" $ | nindent 4 }}
    {{- if (ternary true $s.internetHttps (kindIs "invalid" $s.internetHttps)) }}
    {{- include "ligus.internetHttpsEgress" $ | nindent 4 }}
    {{- end }}
    {{- with $s.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
