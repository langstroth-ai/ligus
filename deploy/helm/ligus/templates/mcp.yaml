{{- range $i, $s := .Values.mcp.servers }}
{{- if $i }}
---
{{- end }}
{{- $name := printf "mcp-%s" $s.name | trunc 63 | trimSuffix "-" }}
{{- if and (not (contains "@sha256:" (required "mcp.servers[].image is required" $s.image))) (not $s.allowUnpinned) }}
{{- fail (printf "mcp.servers[%s].image must be pinned by digest (image@sha256:...): MCP servers are third-party code that holds their secrets. Set allowUnpinned=true to accept a tag." $s.name) }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp
    ligus.ai/mcp: {{ $s.name | quote }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ default 8080 $s.port }}
      targetPort: http
  selector:
    {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 4 }}
    ligus.ai/mcp: {{ $s.name | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp
    ligus.ai/mcp: {{ $s.name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 6 }}
      ligus.ai/mcp: {{ $s.name | quote }}
  template:
    metadata:
      labels:
        {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 8 }}
        ligus.ai/mcp: {{ $s.name | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          image: {{ required "mcp.servers[].image is required" $s.image }}
          {{- with $s.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ default 8080 $s.port }}
          {{- with $s.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $s.secretEnv }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          resources:
            {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "500m" "memory" "256Mi")) $s.resources) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# Only this workspace's serve/worker/executor pods may call this MCP server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ligus.selectorLabels" (dict "root" $ "component" "mcp") | nindent 6 }}
      ligus.ai/mcp: {{ $s.name | quote }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: ligus.ai/role
                operator: In
                values: [controller, executor]
      ports:
        - port: http
{{- end }}
