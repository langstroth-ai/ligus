{{- if .Values.worker.enabled }}
{{- $fullname := include "ligus.fullname" . -}}
{{- $v := .Values.worker -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "ligus.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  clusterIP: None
  selector:
    {{- include "ligus.selectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
{{- range $inst := $v.instances }}
---
# Worker host {{ $inst.name }}: its own identity and volumes, exactly one
# pod. Hosts are listed, never scaled: a replica count would mint host
# identities nobody approved.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-worker-{{ $inst.name }}
  labels:
    {{- include "ligus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    ligus.ai/worker: {{ $inst.name | quote }}
spec:
  serviceName: {{ $fullname }}-worker
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "ligus.selectorLabels" (dict "root" $ "component" "worker") | nindent 6 }}
      ligus.ai/worker: {{ $inst.name | quote }}
  template:
    metadata:
      labels:
        {{- include "ligus.selectorLabels" (dict "root" $ "component" "worker") | nindent 8 }}
        ligus.ai/worker: {{ $inst.name | quote }}
        ligus.ai/role: controller
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secrets: {{ include "ligus.secretsChecksum" (dict "root" $ "v" $v "component" "worker") }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "ligus.podSpecCommon" $ | nindent 6 }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- if $.Values.agentSandbox.preflight.enabled }}
      initContainers:
        {{- include "ligus.preflightInit" (dict "root" $ "env" (print (include "ligus.commonEnv" $) "\n" (include "ligus.hostSecretEnv" (dict "root" $ "v" $v "component" "worker"))) "mounts" (include "ligus.workerMounts" $)) | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "ligus.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["worker", "--label", {{ $inst.name | quote }}, "--health-listen", "0.0.0.0:8788"]
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          # Probes only: the NetworkPolicy admits no other pod to this port.
          ports:
            - name: health
              containerPort: 8788
          env:
            {{- include "ligus.commonEnv" $ | nindent 12 }}
            {{- with (default $v.permissionMode $inst.permissionMode) }}
            - name: LIGUS_WORKER_PERMISSION_MODE
              value: {{ . | quote }}
            {{- end }}
            {{- if $v.runtimesToml }}
            - name: LIGUS_RUNTIMES_FILE
              value: /etc/ligus/runtimes/runtimes.toml
            {{- end }}
            {{- include "ligus.hostSecretEnv" (dict "root" $ "v" $v "component" "worker") | nindent 12 }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /v1/health, port: health }
            periodSeconds: 5
            failureThreshold: 60
          # Ready once registered with its store open.
          readinessProbe:
            httpGet: { path: /v1/ready, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /v1/health, port: health }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml (default $v.resources $inst.resources) | nindent 12 }}
          volumeMounts:
            {{- include "ligus.workerMounts" $ | nindent 12 }}
      volumes:
        {{- include "ligus.secretVolumes" (dict "root" $ "v" $v "component" "worker") | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- if $v.runtimesToml }}
        - name: runtimes
          configMap:
            name: {{ $fullname }}-worker
            items:
              - { key: runtimes.toml, path: runtimes.toml }
        {{- end }}
  volumeClaimTemplates:
    {{- include "ligus.claimTemplates" (dict "root" $ "v" $v "component" "worker") | nindent 4 }}
{{- end }}
{{- end }}
