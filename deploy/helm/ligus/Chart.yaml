apiVersion: v2
name: ligus
description: Ligus on Kubernetes - an always-on serve device per workspace, optional worker hosts and MCP servers, with the relay as an optional dependency. Preview; install from a checkout (this chart and its image are not published).
type: application
version: 0.1.1
# The CLI image this chart is tested against (it reads only LIGUS_* settings, so 0.1 or later).
appVersion: "0.1.1"
home: https://ligus.ai
keywords:
  - ligus
  - agents
  - e2ee
kubeVersion: ">=1.27.0-0"
dependencies:
  # The relay chart lives in the relay repository (relay v0.3.0) and is
  # published to the OCI registry below: `helm dependency build` fetches it
  # into charts/ (README). Most installs point at an existing relay
  # (relayUrl) instead.
  - name: langstroth-relay
    alias: relay
    version: 0.3.0
    repository: oci://ghcr.io/langstroth-ai/charts
    condition: relay.enabled
