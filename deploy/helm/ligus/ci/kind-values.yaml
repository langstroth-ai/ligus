# Values for a kind/CI smoke install: a throwaway workspace (Secret ws-smoke,
# created by the workflow) against a relay
# installed separately in namespace langstroth-relay (release name langstroth-relay,
# Postgres enabled), the tunnel over in-cluster http and egress locked down.
image:
  repository: ligus
  tag: dev
  pullPolicy: IfNotPresent
relayUrl: http://langstroth-relay-sync.langstroth-relay.svc.cluster.local:8443
workspace:
  # Created by the workflow (kubectl create secret, a throwaway room and key).
  existingSecret: ws-smoke
remote:
  enabled: true
  relayUrl: http://langstroth-relay-tunnel.langstroth-relay.svc.cluster.local:8443
  insecureRelay: true
serve:
  admission:
    existingSecret: ws-smoke-serve-admission
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
  home:
    size: 256Mi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi }
# serve and worker w1 join ONE workspace, each as its own service member:
# the workflow's headless founder issues one single-use box admission per
# box and stores each in a Secret the box redeems at start-up.
worker:
  enabled: true
  instances:
    - name: w1
      admission:
        existingSecret: ws-smoke-w1-admission
  # kind's local-path provisioner is not CSI; ReadWriteOncePod needs a CSI
  # driver, so CI uses ReadWriteOnce.
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
  home:
    size: 256Mi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi }
networkPolicy:
  restrictEgress: true
  relayNamespace: langstroth-relay
  namespaceDefaultDeny: true
