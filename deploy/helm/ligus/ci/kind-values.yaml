# Values for a kind/CI smoke install: a throwaway workspace (Secret ws-smoke,
# created by the workflow) against a relay
# installed separately in namespace langstroth-relay (release name langstroth-relay,
# Postgres enabled), the tunnel over in-cluster http and egress locked down.
image:
  repository: ligus
  tag: dev
  pullPolicy: IfNotPresent
relayUrl: http://langstroth-relay-sync.langstroth-relay.svc.cluster.local:8443
workspace:
  # Created by the workflow (kubectl create secret, a throwaway room and key).
  existingSecret: ws-smoke
remote:
  enabled: true
  relayUrl: http://langstroth-relay-tunnel.langstroth-relay.svc.cluster.local:8443
  insecureRelay: true
serve:
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
  home:
    size: 256Mi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi }
# Off here: the workflow installs the worker as its own release on its own
# throwaway workspace (worker.enabled=true, serve.enabled=false). In 0.1 a box
# joins a workspace only through an invite an Admin issued (key possession
# never admits anyone), and nothing in CI can issue one headlessly yet (the
# member-bootstrap work). With serve and a worker started together on one
# fresh workspace, whichever box touches the config log first founds it as
# Owner and the other is refused (role Viewer cannot perform memberAdded):
# serve then exits 1 and the install never becomes ready.
worker:
  enabled: false
  instances:
    - name: w1
  # kind's local-path provisioner is not CSI; ReadWriteOncePod needs a CSI
  # driver, so CI uses ReadWriteOnce.
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
  home:
    size: 256Mi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: "1", memory: 512Mi, ephemeral-storage: 1Gi }
networkPolicy:
  restrictEgress: true
  relayNamespace: langstroth-relay
  namespaceDefaultDeny: true
