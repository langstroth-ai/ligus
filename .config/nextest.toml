# cargo-nextest settings (https://nexte.st). CI runs `--profile ci`; the
# default profile is what `cargo nextest run` uses locally. Doctests aren't
# run by nextest: CI runs `cargo test --doc` separately.

[profile.ci]
# Report every failure, not just the first.
fail-fast = false
# Print a failing test's output where it fails and again in the summary.
failure-output = "immediate-final"
# Flag tests that run past a minute, so slow tests show up, and kill any
# still running after ten: a hung test fails by name instead of eating the
# job's timeout and taking every other result with it.
slow-timeout = { period = "60s", terminate-after = 10 }

# ci-nightly.yml's deep run: PROPTEST_CASES=4096 makes each property suite
# 16x longer, so flag at five minutes and kill at forty.
[profile.ci-nightly]
inherits = "ci"
slow-timeout = { period = "300s", terminate-after = 8 }

# The serve end-to-end tests aren't property suites: PROPTEST_CASES doesn't
# lengthen them, so a hung one fails in twelve minutes, not forty.
[[profile.ci-nightly.overrides]]
filter = 'package(ligus-cli) & test(/^serve::/)'
slow-timeout = { period = "120s", terminate-after = 6 }
