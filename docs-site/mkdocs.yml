# Langstroth documentation: https://docs.langstroth.ai/
# One MkDocs (Material) site with two sections:
#   docs/ligus/    Using Ligus            -> https://docs.langstroth.ai/ligus/
#   docs/operate/  Operating Langstroth   -> https://docs.langstroth.ai/operate/
# Build: mkdocs build --strict -f docs-site/mkdocs.yml  (see docs-site/README.md)
site_name: Langstroth
site_description: Langstroth and Ligus documentation. Ligus (short for ligustica) is a shared LLM workspace for developers; Langstroth is the self-hostable platform behind it.
site_url: https://docs.langstroth.ai/
repo_url: https://github.com/langstroth-ai/ligus
repo_name: langstroth-ai/ligus
copyright: MIT-licensed
docs_dir: docs
site_dir: site

theme:
  name: material
  # Logo, favicon and stylesheet live in docs-site/theme and are copied
  # into the built site at the same paths.
  custom_dir: theme
  logo: images/ligus-logo.svg
  favicon: images/ligus-favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Material icon/emoji shortcodes (:material-…:, :octicons-…:) → inline SVGs.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

validation:
  # Links between the two sections are relative and must resolve; anchors
  # are checked too.
  anchors: warn

plugins:
  - search
  # Stub pages at every old path (the old docs.ligus.ai and
  # docs.langstroth.ai sites), so an old link still lands
  # on its page from any host. On Netlify, netlify.toml answers these paths
  # with real 301s first. Generated by tools/redirects.py.
  - redirects:
      redirect_maps:
        # BEGIN generated redirect_maps
        addons/acp.md: ligus/addons/acp.md
