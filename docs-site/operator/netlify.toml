# Netlify config for the Langstroth operator docs (docs.langstroth.ai).
# In the Netlify UI, set this site's base directory to docs-site/operator; Netlify
# then reads this file. Paths below are relative to that base directory.
# See docs-site/README.md.

[build]
  command = "pip install -r ../requirements.txt && mkdocs build --strict"
  publish = "site"
  # Skip deploys when nothing this site is built from changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../theme ../mkdocs-base.yml ../requirements.txt"

[build.environment]
  PYTHON_VERSION = "3.12"
  NO_MKDOCS_2_WARNING = "1"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # Material for MkDocs uses small inline scripts and styles; mermaid comes
    # from unpkg; the theme's fonts come from Google Fonts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

