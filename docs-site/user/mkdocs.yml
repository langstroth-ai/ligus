# Ligus user documentation: https://docs.ligus.ai/
# Build: mkdocs build --strict -f docs-site/user/mkdocs.yml  (see docs-site/README.md)
INHERIT: ../mkdocs-base.yml
site_name: Ligus
site_description: Ligus (short for ligustica) — a shared LLM workspace for devs. Bring your own subscription, your own agents.
site_url: https://docs.ligus.ai/

plugins:
  - search
  # Stub pages for paths that moved, so old links keep working on hosts
  # that can't send 301s (GitHub Pages). On Netlify, netlify.toml answers
  # these paths with real 301s first. Generated by tools/redirects.py.
  - redirects:
      redirect_maps:
        # BEGIN generated redirect_maps
        concepts/headless-agents.md: https://docs.langstroth.ai/concepts/headless-agents/
        deploy/index.md: https://docs.langstroth.ai/deploy/
