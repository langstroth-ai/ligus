        deploy/kubernetes.md: https://docs.langstroth.ai/deploy/kubernetes/
        deploy/ligus-auth-dex.md: https://docs.langstroth.ai/deploy/ligus-auth-dex/
        deploy/ligus-auth-pocket-id.md: https://docs.langstroth.ai/deploy/ligus-auth-pocket-id/
        deploy/ligus-auth.md: https://docs.langstroth.ai/deploy/ligus-auth/
        deploy/model-gateways.md: https://docs.langstroth.ai/deploy/model-gateways/
        deploy/multi-tenant.md: https://docs.langstroth.ai/deploy/multi-tenant/
        deploy/personal-fleet.md: https://docs.langstroth.ai/deploy/personal-fleet/
        deploy/solo.md: https://docs.langstroth.ai/deploy/solo/
        deploy/upgrade-from-hive.md: https://docs.langstroth.ai/deploy/upgrade-from-hive/
        deploy/with-an-agent.md: https://docs.langstroth.ai/deploy/with-an-agent/
        networking/lan.md: https://docs.langstroth.ai/networking/lan/
        networking/remote-access.md: https://docs.langstroth.ai/networking/remote-access/
        networking/rendezvous.md: https://docs.langstroth.ai/networking/rendezvous/
        networking/self-host.md: https://docs.langstroth.ai/networking/self-host/
        networking/turn.md: https://docs.langstroth.ai/networking/turn/
        ops/build.md: https://docs.langstroth.ai/ops/build/
        ops/deployment.md: https://docs.langstroth.ai/ops/deployment/
        ops/linux-sandbox.md: https://docs.langstroth.ai/ops/linux-sandbox/
        ops/managed-service.md: https://docs.langstroth.ai/ops/managed-service/
        ops/operations.md: https://docs.langstroth.ai/ops/operations/
