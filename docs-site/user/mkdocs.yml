        reference/identity-link-statement.md: https://docs.langstroth.ai/reference/identity-link-statement/
        reference/invite-payload.md: https://docs.langstroth.ai/reference/invite-payload/
        reference/serve-api.md: https://docs.langstroth.ai/reference/serve-api/
        reference/wire-protocols.md: https://docs.langstroth.ai/reference/wire-protocols/
