[package]
name = "ligus-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ligus desktop shell (Tauri v2)"

[lib]
name = "ligus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ligus-core.workspace = true
ligus-proto.workspace = true
# Inherits default-features = false from the workspace root, so this app's own
# `p2p` feature is what enables ligus-runtime's iroh-backed P2P.
ligus-runtime.workspace = true
# Re-serializes URLs before the OS opens them (`browser_command`).
url = "2"
ligus-forge.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
# Structured logging → a rolling daily file in the OS log dir (+ stderr), so
# background errors (sync/scheduler/workflow) are diagnosable after the fact
# instead of vanishing to a stderr no one sees in a GUI launch.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# QR encoder for the add-a-phone offer (already in the lockfile through ligus-cli).
qrcodegen = "1.8"
# join_all for parallel workflow stages (already in the graph via tauri).
futures = "0.3"
# `devtools` enables the web inspector in release builds too (right-click →
# Inspect) — kept on through the beta so testers can profile perf.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
# Auto-updater (scaffolded; inert until updater keys + createUpdaterArtifacts
# are enabled at public launch — see #144).
tauri-plugin-updater = "2"
rfd = "0.17.2"
# Embedded terminal: a real PTY spawning the user's shell in the workspace root.
portable-pty = "0.9"
# Debounced workspace file watcher → `workspace://fs-changed` events, so the
# editor/file-tree refresh when files change on disk (git ops, agent edits).
notify = "8.2.1"
notify-debouncer-full = "0.7"
toml = "1.2"
base64 = "0.23"
ed25519-dalek = "3"
# Like std::fs::canonicalize but strips Windows's `\\?\` verbatim prefix for
# normal drive paths (keeps it only for genuinely long/UNC paths) — so the
# workspace root shows as `C:\…`, not `\\?\C:\…`. Already in the tree.
dunce = "1"
# Used by check_for_app_update to fetch the public version manifest (in Rust, so
# there's no webview CORS issue). Same features as ligus-runtime; already built.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

# macOS-only: native platform passkeys (AuthenticationServices), app/src/passkey_native.
# The objc2 family Tauri already pulls; objc2-authentication-services 0.3.2 is
# the same generation as the objc2-* 0.3.2 crates in the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSObject", "NSString"] }
objc2-authentication-services = { version = "0.3.2", default-features = false, features = [
    "std",
    "ASAuthorization",
    "ASAuthorizationController",
    "ASAuthorizationCredential",
    "ASAuthorizationError",
    "ASAuthorizationPlatformPublicKeyCredentialAssertion",
    "ASAuthorizationPlatformPublicKeyCredentialAssertionRequest",
    "ASAuthorizationPlatformPublicKeyCredentialDescriptor",
    "ASAuthorizationPlatformPublicKeyCredentialProvider",
    "ASAuthorizationPlatformPublicKeyCredentialRegistration",
    "ASAuthorizationPlatformPublicKeyCredentialRegistrationRequest",
    "ASAuthorizationProvider",
    "ASAuthorizationPublicKeyCredentialAssertion",
    "ASAuthorizationPublicKeyCredentialAssertionRequest",
    "ASAuthorizationPublicKeyCredentialConstants",
    "ASAuthorizationPublicKeyCredentialDescriptor",
    "ASAuthorizationPublicKeyCredentialRegistration",
    "ASAuthorizationPublicKeyCredentialRegistrationRequest",
    "ASAuthorizationRequest",
    "ASFoundation",
    "ASPublicKeyCredential",
] }

# Windows-only: themed native title bar (DWM caption color) so the title bar
# matches the app background. Version pinned to what Tauri 2.12 already pulls,
# so this adds no new crate to the build graph.
[target.'cfg(windows)'.dependencies]
# Win32_Networking_WindowsWebServices + Win32_System_LibraryLoader: native
# passkeys through webauthn.dll, loaded at run time (app/src/passkey_native).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Networking_WindowsWebServices", "Win32_System_LibraryLoader"] }

[features]
# P2P on by default. Only the Windows cross-compile turns it off, via
# `--no-default-features` (iroh's `wmi` dep can't cross-compile via cargo-xwin).
default = ["p2p"]
# Direct peer-to-peer (iroh).
p2p = ["ligus-runtime/p2p"]
# The in-app live test (`tests/app_live.rs`): exposes `ligus_desktop_lib::e2e`.
e2e = []

[[test]]
name = "app_live"
harness = false

[dev-dependencies]
# Tests answer passkey prompts with a test recovery key (never in a real build).
ligus-runtime = { workspace = true, features = ["test-presence"] }
