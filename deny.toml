# cargo-deny configuration — the dependency-security gate for the Rust workspace.
# Run locally with `cargo deny check`; CI runs it via .github/workflows/security-audit.yml.

[advisories]
version = 2
# Fail on any RUSTSEC advisory (vulnerability) or a yanked crate. Newer cargo-deny
# dropped the per-severity `unmaintained = "warn"` in favour of a *scope* selector
# ("all" | "workspace" | "transitive" | "none") — the old string no longer
# deserializes, which is what had been failing this workflow. "workspace" only
# flags unmaintained crates we depend on directly (actionable), so a transitive
# unmaintained dep we can't fix doesn't wedge the pipeline; ignore specific
# advisory IDs below if one legitimately shouldn't block.
yanked = "deny"
unmaintained = "workspace"
# (The quick-xml ignores RUSTSEC-2026-0194/0195 are gone: the lockfile now
# resolves quick-xml >= 0.41 on every path, and cargo-deny reported them
# advisory-not-detected.)
#
# RUSTSEC-2026-0387 (crypto-bigint 0.5 constant-time gaps): crypto-bigint 0.5.5
# is reached ONLY via ssh-key 0.6 -> p256/p384/p521 0.13 (identity links,
# crates/ligus-runtime/src/identity_links.rs), which Ligus uses to VERIFY
# SSHSIG signatures: public key, public message, public signature, so there
# is no secret integer for a timing side channel to leak. Ligus's own P-256
# code (ligus-core presence) is on p256 0.14 / crypto-bigint 0.7.11, which is
# patched. The fix for the ssh-key path is ssh-key 0.7 (RustCrypto 0.14 line),
# which is still a release candidate. Review by 2027-02-15, or as soon as
# ssh-key 0.7.0 ships; never extend this to code that signs with these curves.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via ssh-key 0.6 SSHSIG verification (public inputs); fixed in ssh-key 0.7 (rc only); review by 2027-02-15" },
]

[licenses]
version = 2
# Permissive licenses only — matches the current dependency tree. Add a license
# here (with justification) if a new dep legitimately needs it, rather than
# lowering the bar. cargo-deny accepts an SPDX expression if ANY branch is allowed.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "OpenSSL",
    # The Mozilla CA-certificate bundles (webpki-roots / webpki-root-certs, via
    # reqwest/rustls) ship the root store under this permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Surface (but don't block on) duplicate versions and wildcard version reqs.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io + in-repo path deps; no unknown registries or git sources.
unknown-registry = "deny"
unknown-git = "deny"
