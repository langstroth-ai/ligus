[package]
name = "ligus-cli"
version = "0.4.1"
edition.workspace = true
license.workspace = true

# A headless Ligus client — connect to a relay, sync a workspace's E2EE event
# log, read/write signed events. The `ligus` binary a cloud-hosted agent runs
# instead of the desktop app. Composes ligus-core + ligus-runtime; no Tauri.
[[bin]]
name = "ligus"
path = "src/main.rs"

[dependencies]
ligus-core = { path = "../ligus-core" }
ligus-proto = { path = "../ligus-proto" }
ligus-runtime = { path = "../ligus-runtime" }
ligus-forge = { path = "../ligus-forge" }
anyhow.workspace = true
uuid.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1.2"
base64 = "0.23"
# `ligus serve` (the home host for the iOS app): HTTP + SSE API. axum,
# reqwest, futures-util and getrandom are shared with ligus-runtime (deps /
# dev-deps); qrcodegen is a dependency-free QR encoder for the pairing code.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
# The API's own accept loop (serve/listener.rs): hyper's HTTP/1 server with
# a header-read timeout and an idle timeout, which axum::serve doesn't set.
# Both already come in through axum.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["server", "http1", "service", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "query"] }
futures-util = "0.3"
getrandom = "0.4"
qrcodegen = "1.8"
# Wipes secrets read from flags and files (recovery words, seeds) after use.
zeroize = "1"
tracing.workspace = true
time = { workspace = true, features = ["local-offset"] }
# Relay tunnel (`hive-tunnel/1`, docs/relay-tunnel.md): Noise IK/IKpsk1 (snow),
# Ed25519 host signing key + credentials, HKDF/SHA-256 derivations,
# ChaCha20-Poly1305 for end-to-end push, the control/accept WebSockets
# (tokio-tungstenite over rustls, ring provider like reqwest), and tower's
# oneshot to call the axum router in process.
snow = "0.10"
ed25519-dalek = "3"
x25519-dalek = { version = "3", features = ["static_secrets"] }
sha2 = "0.11"
hkdf = "0.13"
hmac = "0.13"
chacha20poly1305 = "0.11"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

# prctl(PR_SET_DUMPABLE) for the long-running hosts (src/hardening.rs), and
# the terminal's echo off while a code is pasted (src/link_io.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests answer passkey prompts with a test recovery key (never in a real build).
ligus-runtime = { path = "../ligus-runtime", features = ["test-presence"] }
async-trait = "0.1"
tempfile = "3"
libc = "0.2"
hex = "0.4"
