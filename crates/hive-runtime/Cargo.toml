[package]
name = "hive-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hive-core.workspace = true
hive-proto.workspace = true
hive-forge.workspace = true
async-trait = "0.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "query", "form"] }
futures-util = "0.3"
base64 = "0.23"
# MCP OAuth 2.1 (PKCE): SHA-256 challenge + random verifier/state. Versions
# already in the tree (hive-core uses them), so no new crates are pulled.
sha2 = "0.11"
# Per-relay contact write keys (already in the tree via hive-core).
hkdf = "0.13"
getrandom = "0.4"
# Built-in coding tools (search). Both already in the lockfile.
regex = "1"
# Exact-match redaction of Ligus's own secrets (already in the tree via regex).
aho-corasick = "1"
# Egress proxy allow-list parsing (already in the tree via hive-core).
url = "2"
walkdir = "2"
# Zeroized secret buffers (B2; already in the tree).
zeroize = "1"
# Identity links (IDENTITY-AND-FORGES §2.5): SSHSIG verification for
# ssh-ed25519, sk-ssh-ed25519, ecdsa-sha2-nistp256, sk-ecdsa-sha2-nistp256 and
# rsa-sha2-512. Verification only (public-key operations). ssh-key's own "rsa"
# feature is off: it pulls rsa 0.9 (RUSTSEC-2023-0071). RSA SSHSIG signatures
# are verified in `identity_links` with rsa 0.10 (PKCS#1 v1.5, SHA-512).
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "std", "ecdsa", "ed25519", "p256"] }
rsa = { version = "0.10.0", default-features = false, features = ["std", "pkcs1v15"] }
iroh = { version = "1.4.1", optional = true }

# B2: Ligus's own keychain file on macOS (already in the tree via rustls).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# The Linux agent sandbox's pre-exec helper (see `executor::linux`).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

# setsid for confined children; flock for the ligus-auth refresh lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Whether a turn dir's owner process is still running (`executor::pid_alive`).
# The version Tauri and the app already pull, so no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
# P2P is ON by default. The Windows *cross-compile* (cargo-xwin) is the one
# build that must drop it — iroh pulls the `wmi` crate (Windows COM) which can't
# cross-compile — via `--no-default-features`, which works because the workspace
# root declares this crate with default-features = false. Native builds (incl.
# native Windows) keep P2P.
default = ["p2p"]
# Direct peer-to-peer transport (iroh).
p2p = ["dep:iroh"]

[dev-dependencies]
tempfile = "3"
axum = "0.8"
proptest = { version = "1", default-features = false, features = ["std"] }
