[package]
name = "hive-forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ligus forges: one trait over GitHub, GitLab and Forgejo/Gitea/Codeberg for repo work (pure HTTP plus git argv builders)"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "query", "form"] }
# reqwest 0.13's `rustls-no-provider` needs a process-level rustls provider;
# `http::install_tls_provider` installs ring (already in the tree via iroh and
# tauri-plugin-updater), so aws-lc-rs is never pulled in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Fallback roots when the OS has no CA store (already in the tree via iroh-relay
# and tokio-tungstenite).
webpki-roots = "1"
# The OS trust store verifier reqwest uses, built directly for TLS outside
# reqwest (the relay tunnel) so both trust the same roots. Already in the
# tree via reqwest.
rustls-platform-verifier = "0.7"
url = "2"
# The proxy settings reqwest applies (env, plus the OS settings on macOS and
# Windows via client-proxy-system, the same feature reqwest's system-proxy
# turns on), read by the public-address guard so it sees the same proxies.
http = "1"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
zeroize = "1"
toml = "1.2"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
hive-core.workspace = true
