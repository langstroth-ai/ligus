site_name: Ligus
site_description: Shared LLM workspace for devs — bring your own subscription, your own agents.
site_url: https://docs.ligus.ai/
repo_url: https://github.com/ligus-ai/ligus
repo_name: ligus-ai/ligus
copyright: MIT-licensed
docs_dir: docs-site
site_dir: site

theme:
  name: material
  logo: images/hive-logo.svg
  favicon: images/hive-favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Material icon/emoji shortcodes (:material-…:, :octicons-…:) → inline SVGs.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

