[workspace]
resolver = "2"
members = [
    "crates/hive-core",
    "crates/hive-proto",
    "crates/hive-runtime",
    "crates/hive-forge",
    "crates/hive-cli",
    "app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Ligus"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: signatures cover re-serialized payloads, so floats must
# parse back to the exact bits they were written from (see hive-core sec_tests).
# raw_value: envelopes keep the bytes they were signed over (hive-core
# envelope_wire), so unknown fields survive verification, storage and re-sync.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
ts-rs = "12"

# Internal crates
hive-core = { path = "crates/hive-core" }
hive-proto = { path = "crates/hive-proto" }
# default-features = false MUST be set here at the workspace root (not just on
# the member dep) or cargo silently ignores it. This lets the app's own `p2p`
# feature gate whether hive-runtime pulls iroh, so the Windows cross-build can
# drop it via `--no-default-features` while native builds keep P2P on.
hive-runtime = { path = "crates/hive-runtime", default-features = false }
hive-forge = { path = "crates/hive-forge" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
