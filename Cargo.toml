[workspace]
resolver = "2"
# A standalone crate that builds the last release's core next to this one
# (mixed-version tests); outside the workspace so `-p ligus-core` stays
# unambiguous and the release's git source stays out of the main lockfile.
exclude = ["compat/v03"]
members = [
    "crates/ligus-core",
    "crates/ligus-proto",
    "crates/ligus-runtime",
    "crates/ligus-forge",
    "crates/ligus-cli",
    "app",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Ligus"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: signatures cover re-serialized payloads, so floats must
# parse back to the exact bits they were written from (see ligus-core sec_tests).
# raw_value: envelopes keep the bytes they were signed over (ligus-core
# envelope_wire), so unknown fields survive verification, storage and re-sync.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
ts-rs = "12"

# Internal crates
ligus-core = { path = "crates/ligus-core" }
ligus-proto = { path = "crates/ligus-proto" }
# default-features = false MUST be set here at the workspace root (not just on
# the member dep) or cargo silently ignores it. This lets the app's own `p2p`
# feature gate whether ligus-runtime pulls iroh, so the Windows cross-build can
# drop it via `--no-default-features` while native builds keep P2P on.
ligus-runtime = { path = "crates/ligus-runtime", default-features = false }
ligus-forge = { path = "crates/ligus-forge" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Optimise the crypto crates in debug and test builds. Unoptimised, they
# dominate every signed-log test, and on x86_64 curve25519-dalek picks its
# AVX2 backend at run time, whose intrinsics are out-of-line calls at
# opt-level 0: the authz property suites ran about 20x slower on the Linux and
# Windows runners than on Apple silicon (prop_authz_is_prefix_stable: 1403s
# against 72s at 256 cases). Same code, same backends, same results; only
# the codegen of these dependencies changes.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.ecdsa]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
